<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="60%" stop-color="#141416"/>
      <stop offset="100%" stop-color="#0A0A0C"/>
    </radialGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EB7A25" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#EB7A25" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EB7A25"/>
      <stop offset="100%" stop-color="#FFA254"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>

  <!-- Subtle Perspective Film Strip Lines -->
  <g opacity="0.12" stroke="#FFFFFF" stroke-width="1.5">
    <line x1="40" y1="60" x2="760" y2="60"/>
    <line x1="40" y1="110" x2="760" y2="110"/>
    <line x1="40" y1="490" x2="760" y2="490"/>
    <line x1="40" y1="540" x2="760" y2="540"/>
    <!-- Perforations -->
    <rect x="70" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="150" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="230" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="310" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="390" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="470" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="550" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="630" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
    <rect x="710" y="75" width="30" height="20" rx="4" fill="#FFFFFF"/>
  </g>

  <!-- Center Abstract Visual Aperture / Soundwave Graphic -->
  <circle cx="400" cy="300" r="140" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="2"/>
  <circle cx="400" cy="300" r="100" stroke="#EB7A25" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="8 6"/>
  <circle cx="400" cy="300" r="60" fill="#1C1C20" stroke="#EB7A25" stroke-opacity="0.5" stroke-width="2"/>

  <!-- Stylized Play Icon in Center Graphic -->
  <polygon points="392,284 416,300 392,316" fill="url(#accent)"/>

  <!-- Bottom Visual Details -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif">
    <text x="400" y="440" text-anchor="middle" fill="#FFFFFF" fill-opacity="0.9" font-size="20" font-weight="700" letter-spacing="4">SHOWREEL 2025</text>
    <text x="400" y="468" text-anchor="middle" fill="#8E8E93" font-size="13" font-weight="500" letter-spacing="2">4K • 60FPS • DYNAMIC STORYTELLING</text>
  </g>
</svg>

